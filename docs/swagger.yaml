host: 127.0.0.1:3031
info:
  contact: {}
  description: PhoenixUptime Backend API
  title: PhoenixUptime API
  version: "1.0"
paths:
  /account/change-password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to change their password.
      parameters:
      - description: Password change data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/account.PasswordChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/account.PasswordChangeResponse'
        "400":
          description: Bad request - invalid input
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: Unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "403":
          description: Forbidden - incorrect current password
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Change User Password
      tags:
      - Account
  /account/me:
    get:
      consumes:
      - application/json
      description: Returns basic information about the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: user basic information
          schema:
            $ref: '#/definitions/account.UserResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Get User Information
      tags:
      - Account
  /account/reset-api-key:
    post:
      consumes:
      - application/json
      description: Resets the API key for the authenticated user and returns the new
        API key.
      produces:
      - application/json
      responses:
        "200":
          description: new API key
          schema:
            $ref: '#/definitions/account.ResetAPIKeyResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Reset API Key
      tags:
      - Account
  /account/settings:
    get:
      consumes:
      - application/json
      description: Returns SMTP and Telegram bot settings for the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: user settings
          schema:
            $ref: '#/definitions/account.SettingsResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Get User Settings
      tags:
      - Account
  /account/settings/smtp:
    post:
      consumes:
      - application/json
      description: Updates the SMTP settings for the authenticated user.
      parameters:
      - description: SMTP settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/account.UpdateSMTPSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: settings updated
          schema:
            $ref: '#/definitions/routes.SuccessResponse'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Update SMTP Settings
      tags:
      - Account
  /account/settings/telegram:
    post:
      consumes:
      - application/json
      description: Updates the Telegram bot settings for the authenticated user.
      parameters:
      - description: Telegram bot settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/account.UpdateTelegramBotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: settings updated
          schema:
            $ref: '#/definitions/routes.SuccessResponse'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Update Telegram Bot Settings
      tags:
      - Account
  /alert-rules:
    get:
      consumes:
      - application/json
      description: Returns alert rules owned by the authenticated user.
      parameters:
      - description: down, recovered, degraded, or certificate_expiring
        in: query
        name: event
        type: string
      - description: all, tags, or monitors
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: alert rule list
          schema:
            $ref: '#/definitions/alert_rules.AlertRuleListResponse'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: List Alert Rules
      tags:
      - Alert Rules
    post:
      consumes:
      - application/json
      description: Creates an alert rule owned by the authenticated user.
      parameters:
      - description: alert rule payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/alert_rules.CreateAlertRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: created alert rule
          schema:
            $ref: '#/definitions/alert_rules.AlertRuleResponse'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Create Alert Rule
      tags:
      - Alert Rules
  /alert-rules/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes one alert rule owned by the authenticated user.
      parameters:
      - description: Alert Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: alert rule deleted
          schema:
            $ref: '#/definitions/routes.SuccessResponse'
        "400":
          description: invalid alert rule id
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "404":
          description: alert rule not found
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Delete Alert Rule
      tags:
      - Alert Rules
    get:
      consumes:
      - application/json
      description: Returns one alert rule owned by the authenticated user.
      parameters:
      - description: Alert Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: alert rule
          schema:
            $ref: '#/definitions/alert_rules.AlertRuleResponse'
        "400":
          description: invalid alert rule id
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "401":
          description: unauthorized - invalid or missing API key
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "404":
          description: alert rule not found
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/routes.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - ApiKeyQuery: []
      summary: Get Alert Rule
      tags:
      - Alert Rules
    patch:
      consumes:
      - application/json
      description: Updates one alert rule owned by the authenticated user.
      parameters:
      - description: Alert Rule ID
        in: path
        name: id
        required: true
        type: integer
      - description: alert rule payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/alert_rules.UpdateAlertRuleRequest'
